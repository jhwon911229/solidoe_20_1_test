<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 리소스 모니터</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖥️ 시스템 리소스 모니터</h1>
            <div class="header-info">
                <div class="timer">
                    <span class="label">모니터링 시간:</span>
                    <span id="elapsed-time" class="value">00:00</span>
                </div>
                <div class="system-info" id="system-info"></div>
            </div>
            <button id="export-pdf" class="export-btn">📄 PDF로 내보내기</button>
        </header>

        <div id="content">
            <div class="dashboard">
                <!-- Real-time Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card cpu">
                        <div class="stat-header">
                            <span class="stat-icon">⚙️</span>
                            <h3>CPU</h3>
                        </div>
                        <div class="stat-value" id="cpu-value">0%</div>
                        <div class="stat-details" id="cpu-details"></div>
                        <div class="stat-bar">
                            <div class="stat-bar-fill cpu-bar" id="cpu-bar"></div>
                        </div>
                    </div>

                    <div class="stat-card memory">
                        <div class="stat-header">
                            <span class="stat-icon">💾</span>
                            <h3>메모리</h3>
                        </div>
                        <div class="stat-value" id="memory-value">0%</div>
                        <div class="stat-details" id="memory-details"></div>
                        <div class="stat-bar">
                            <div class="stat-bar-fill memory-bar" id="memory-bar"></div>
                        </div>
                    </div>

                    <div class="stat-card disk">
                        <div class="stat-header">
                            <span class="stat-icon">💿</span>
                            <h3>디스크</h3>
                        </div>
                        <div class="stat-value" id="disk-value">0%</div>
                        <div class="stat-details" id="disk-details"></div>
                        <div class="stat-bar">
                            <div class="stat-bar-fill disk-bar" id="disk-bar"></div>
                        </div>
                    </div>

                    <div class="stat-card network">
                        <div class="stat-header">
                            <span class="stat-icon">🌐</span>
                            <h3>네트워크</h3>
                        </div>
                        <div class="stat-value" id="network-value">
                            <div class="network-stats">
                                <span class="download">⬇️ 0 MB/s</span>
                                <span class="upload">⬆️ 0 MB/s</span>
                            </div>
                        </div>
                        <div class="stat-details" id="network-details"></div>
                    </div>

                    <div class="stat-card temperature">
                        <div class="stat-header">
                            <span class="stat-icon">🌡️</span>
                            <h3>온도</h3>
                        </div>
                        <div class="stat-value" id="temp-value">
                            <div class="temp-stats">
                                <span class="cpu-temp">CPU: 0°C</span>
                                <span class="gpu-temp">GPU: 0°C</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-section">
                    <div class="chart-container">
                        <h3>CPU 사용률 추이</h3>
                        <canvas id="cpu-chart"></canvas>
                    </div>

                    <div class="chart-container">
                        <h3>메모리 사용률 추이</h3>
                        <canvas id="memory-chart"></canvas>
                    </div>

                    <div class="chart-container">
                        <h3>네트워크 트래픽</h3>
                        <canvas id="network-chart"></canvas>
                    </div>

                    <div class="chart-container">
                        <h3>온도 모니터링</h3>
                        <canvas id="temp-chart"></canvas>
                    </div>
                </div>

                <!-- Detailed Tables -->
                <div class="tables-section">
                    <div class="table-container">
                        <h3>💿 디스크 상세 정보</h3>
                        <table id="disk-table">
                            <thead>
                                <tr>
                                    <th>파일시스템</th>
                                    <th>타입</th>
                                    <th>크기</th>
                                    <th>사용량</th>
                                    <th>사용률</th>
                                </tr>
                            </thead>
                            <tbody id="disk-table-body"></tbody>
                        </table>
                    </div>

                    <div class="table-container">
                        <h3>🌐 네트워크 인터페이스</h3>
                        <table id="network-table">
                            <thead>
                                <tr>
                                    <th>인터페이스</th>
                                    <th>다운로드</th>
                                    <th>업로드</th>
                                </tr>
                            </thead>
                            <tbody id="network-table-body"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Statistics Summary -->
                <div class="summary-section">
                    <h3>📊 모니터링 통계</h3>
                    <div class="summary-grid" id="summary-stats">
                        <!-- Will be populated dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>실시간 시스템 리소스 모니터링 | 마지막 업데이트: <span id="last-update">-</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
