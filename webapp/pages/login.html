<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - TripSync</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="../index.html">
                    <i class="fas fa-plane"></i>
                    <span>TripSync</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <i class="fas fa-user-circle"></i>
                    <h2>로그인</h2>
                    <p>TripSync에 오신 것을 환영합니다</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> 이메일
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="email@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> 비밀번호
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="비밀번호를 입력하세요"
                            required
                        >
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="remember">
                            <span>로그인 상태 유지</span>
                        </label>
                        <a href="#" class="link">비밀번호 찾기</a>
                    </div>

                    <div id="errorMessage" class="error-message" style="display:none;"></div>

                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> 로그인
                    </button>
                </form>

                <div class="auth-divider">
                    <span>또는</span>
                </div>

                <div class="auth-social">
                    <button class="btn btn-social btn-google">
                        <i class="fab fa-google"></i> Google로 계속하기
                    </button>
                    <button class="btn btn-social btn-facebook">
                        <i class="fab fa-facebook"></i> Facebook으로 계속하기
                    </button>
                </div>

                <div class="auth-footer">
                    <p>계정이 없으신가요? <a href="register.html" class="link">회원가입</a></p>
                </div>
            </div>

            <!-- Demo Credentials Info -->
            <div class="demo-info">
                <i class="fas fa-info-circle"></i>
                <strong>데모 계정:</strong>
                <p>Email: demo@tripsync.com</p>
                <p>Password: demo1234</p>
            </div>
        </div>
    </section>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            // Clear previous error
            errorMessage.style.display = 'none';

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 로그인 중...';

            try {
                const result = await login(email, password);

                if (result.success) {
                    // Redirect to home page
                    window.location.href = '../index.html';
                } else {
                    errorMessage.textContent = result.message || '로그인에 실패했습니다.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = '로그인 중 오류가 발생했습니다.';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 로그인';
            }
        });

        // Demo login
        document.querySelector('.demo-info').addEventListener('click', () => {
            document.getElementById('email').value = 'demo@tripsync.com';
            document.getElementById('password').value = 'demo1234';
        });
    </script>
</body>
</html>
